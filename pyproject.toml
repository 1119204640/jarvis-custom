[project]
name = "jarvis-custom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.0.0",
    "aiosqlite>=0.20.0",
    "beautifulsoup4>=4.12.0",
    "chainlit",
    "fastapi",
    "httpx>=0.27.0",
    "langchain>=1.3.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.0",
    "loguru",
    "markdownify>=1.0.0",
    "mcp>=1.27.1",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pillow>=11.0.0",
    "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=11.0; sys_platform == 'darwin'",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "python-pptx>=0.6.21",
    "python-socketio>=5.0.0",
    "pyyaml>=6.0.3",
    "uvicorn",
    "watchdog",
]

[tool.uv.workspace]
members = [
    "modules/chainlit/backend",
    "modules/loguru",
]

[tool.uv.sources]
# 告诉 uv，这两个依赖直接去本地工作区里找，而不是去 PyPI 下载
chainlit = { workspace = true }
loguru = { workspace = true }
