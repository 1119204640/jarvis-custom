[project]
name = "jarvis-custom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chainlit",
    "langchain>=1.3.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.0",
    "loguru",
    "mcp>=1.27.1",
]

[tool.uv.workspace]
members = [
    "modules/chainlit/backend",
    "modules/loguru",
]

[tool.uv.sources]
# 告诉 uv，这两个依赖直接去本地工作区里找，而不是去 PyPI 下载
chainlit = { workspace = true }
loguru = { workspace = true }
